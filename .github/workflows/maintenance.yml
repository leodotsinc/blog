name: Qualified maintenance preparation
on:
  workflow_dispatch:
    inputs:
      request:
        description: Closed preparation request from the qualified Cloudbox scheduler
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: blog-production-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'leodotsinc/blog' && github.ref == 'refs/heads/main' && github.actor_id == '332011818'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      source_sha: ${{ steps.merge.outputs.source_sha }}
      release_version: ${{ steps.merge.outputs.release_version }}
      maintenance_context: ${{ steps.merge.outputs.maintenance_context }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate closed request and qualified control before network
        env:
          REQUEST_JSON: ${{ inputs.request }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,pathlib
          raw=os.environ['REQUEST_JSON'].encode()
          if len(raw)>16384: raise SystemExit('REQUEST_TOO_LARGE')
          pathlib.Path('maintenance-request.json').write_bytes(raw)
          PY
          python3 scripts/maintenance-execution.py validate --request maintenance-request.json
      - name: Independently qualify source, official metadata and exact CI image
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance-execution.py prepare --request maintenance-request.json
      - name: Reserve request before the single merge attempt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blog-maintenance-attempt-${{ steps.prepare.outputs.request_id }}
          path: maintenance-outcome.json
          if-no-files-found: error
          retention-days: 7
      - name: Revalidate then merge exact head once
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/maintenance-execution.py merge --request maintenance-request.json
      - name: Retain mutation outcome for reconciliation
        if: ${{ !cancelled() && hashFiles('maintenance-outcome.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blog-maintenance-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: maintenance-outcome.json
          if-no-files-found: error
          retention-days: 7
  release:
    needs: prepare
    permissions:
      contents: write
      actions: read
      packages: write
      pull-requests: read
    uses: ./.github/workflows/deploy.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      release_version: ${{ needs.prepare.outputs.release_version }}
      maintenance_context: ${{ needs.prepare.outputs.maintenance_context }}
      maintenance_request: ${{ inputs.request }}
    secrets: inherit
