name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: Install locked dependencies
        run: npm install -g corepack && corepack enable && yarn install --frozen-lockfile
      - name: Test existing lab and release metadata
        run: |
          yarn test:lab
          node --test scripts/release-metadata.test.mjs
      - name: Production build and TypeScript validation
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: yarn build
  release_contract:
    name: Release publication guards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_release*.py'
  image:
    name: Linux image and isolated runtime
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build disposable review image
        env:
          REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg APP_VERSION=0.1.0 \
            --build-arg APP_REVISION="$REVIEW_SHA" --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            -t blog-review:local .
      - name: Verify image identity, isolated runtime and writable cache
        run: python3 scripts/qualify-image.py blog-review:local
      - name: Materialize builder image for development and build package coverage
        run: docker build --platform linux/amd64 --target builder -t blog-maintenance-builder:local -f Dockerfile .
      - name: Bind security evidence to exact image identities
        id: maintenance_images
        run: |
          set -euo pipefail
          echo "runtime=$(docker image inspect blog-review:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
          echo "builder=$(docker image inspect blog-maintenance-builder:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Scan runtime image with fresh vulnerability database
        id: runtime_security
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.runtime }}
          output: maintenance-security/runtime
      - name: Scan build image and development dependencies
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.builder }}
          output: maintenance-security/builder
      - name: Retain bounded sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-review-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: maintenance-security/**/security.json
          if-no-files-found: ignore
          retention-days: 7
