name: Deploy

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      release_version:
        type: string
        required: true
      maintenance_context:
        type: string
        required: true
      maintenance_request:
        type: string
        required: true
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Build and qualify an image without accessing production
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # The qualified caller holds the global lock across merge and this call.
  # Ordinary runs retain the global group; a callee must not reacquire it.
  group: ${{ github.workflow_ref == 'leodotsinc/blog/.github/workflows/maintenance.yml@refs/heads/main' && format('blog-maintenance-child-{0}', github.run_id) || 'blog-production-release' }}
  cancel-in-progress: false

jobs:
  gate:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: Select verified source and version
    if: >-
      github.repository == 'leodotsinc/blog' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.maintenance.outputs.sha || steps.source.outputs.sha }}
      version: ${{ steps.maintenance.outputs.version || steps.version.outputs.version }}
      released: ${{ steps.version.outputs.already_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.maintenance_context != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate qualified maintenance context before source selection
        if: inputs.maintenance_context != ''
        id: maintenance
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ inputs.maintenance_context }}
          REQUEST_JSON: ${{ inputs.maintenance_request }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,pathlib
          for key,name in [('CONTEXT_JSON','maintenance-context.json'),('REQUEST_JSON','maintenance-request.json')]:
            raw=os.environ[key].encode()
            if len(raw)>16384: raise SystemExit('INPUT_TOO_LARGE')
            pathlib.Path(name).write_bytes(raw)
          PY
          python3 scripts/maintenance-execution.py preflight --request maintenance-request.json
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Require current main and exact successful CI
        if: inputs.maintenance_context == ''
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUEST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REF" == refs/heads/main ]]
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$REQUEST_SHA" == "$main_sha" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REQUEST_SHA&status=success" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push")] | length' > ci-count.txt
          [[ $(cat ci-count.txt) -gt 0 ]]
          echo "sha=$REQUEST_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.maintenance_context == ''
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unqualified maintenance before ordinary deployment
        if: inputs.maintenance_context == ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_ONLY: ${{ inputs.prepare_only }}
        run: python3 scripts/maintenance-guard.py
      - name: Select SemVer from successful release tags
        if: inputs.maintenance_context == ''
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select-release.py

  build:
    name: Build and qualify exact image
    needs: gate
    if: needs.gate.outputs.released != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      APP_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
          path: app
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: inputs.maintenance_context != ''
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: trusted
      - name: Recheck approved preparation immediately before building
        if: inputs.maintenance_context != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ inputs.maintenance_context }}
          REQUEST_JSON: ${{ inputs.maintenance_request }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          umask 077
          python3 - <<'PY'
          import os,pathlib
          for key,name in [('CONTEXT_JSON','maintenance-context.json'),('REQUEST_JSON','maintenance-request.json')]:
            raw=os.environ[key].encode()
            if len(raw)>16384: raise SystemExit('INPUT_TOO_LARGE')
            pathlib.Path("../"+name).write_bytes(raw)
          PY
          python3 ../trusted/scripts/maintenance-execution.py preflight --root ../trusted --request ../maintenance-request.json --context ../maintenance-context.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once
        run: |
          set -euo pipefail
          image="ghcr.io/$GITHUB_REPOSITORY:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --platform linux/amd64 --build-arg APP_VERSION="$APP_VERSION" \
            --build-arg APP_REVISION="$RELEASE_SHA" --build-arg APP_BUILD_ID="$GITHUB_RUN_ID" \
            -t "$image" -f Dockerfile .
          echo "$image" > image-tag.txt
      - name: Verify stateless runtime, version and isolated readiness
        id: functional_qualification
        env:
          QUALIFY_SHA: ${{ needs.gate.outputs.sha }}
          QUALIFY_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 scripts/qualify-image.py "$(cat image-tag.txt)" \
            --revision "$QUALIFY_SHA" --version "$QUALIFY_VERSION" --build-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --workflow deploy.yml \
            --output functional-evidence/functional.json
      - name: Retain exact-image functional receipt
        if: ${{ !cancelled() && steps.functional_qualification.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-release-functional-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/functional-evidence/functional.json
          if-no-files-found: error
          retention-days: 7
      - name: Materialize builder image for development and build package coverage
        run: docker build --platform linux/amd64 --target builder -t blog-maintenance-builder:local -f Dockerfile .
      - name: Bind security evidence to exact image identities
        id: maintenance_images
        run: |
          set -euo pipefail
          runtime=$(python3 -c 'import json; print(json.load(open("functional-evidence/functional.json"))["image_id"])')
          [[ "$runtime" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "builder=$(docker image inspect blog-maintenance-builder:local --format '{{.Id}}')" >> "$GITHUB_OUTPUT"
      - name: Scan runtime image with fresh vulnerability database
        id: runtime_security
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.runtime }}
          output: app/maintenance-security/runtime
      - name: Scan build image and development dependencies
        if: ${{ !cancelled() && steps.maintenance_images.outcome == 'success' }}
        uses: leodotsinc/.github/actions/maintenance-scan@902ed57f0e5288e4a0107057cb2e2ca87750a45f
        with:
          image: ${{ steps.maintenance_images.outputs.builder }}
          output: app/maintenance-security/builder
      - name: Retain bounded sanitized security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blog-release-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/maintenance-security/**/security.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Recheck window, source and fresh metadata before publication
        if: inputs.maintenance_context != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: python3 ../trusted/scripts/maintenance-execution.py preflight --root ../trusted --request ../maintenance-request.json --context ../maintenance-context.json
      - name: Publish qualified image and build manifest
        run: |
          set -euo pipefail
          image=$(cat image-tag.txt)
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          python3 scripts/release_manifest.py create \
            --service blog --compose-project leodotsdev --application-kind first_party \
            --app-version "$APP_VERSION" --release-version "$APP_VERSION" \
            --git-sha "$RELEASE_SHA" --image "$digest" --source-repository "https://github.com/$GITHUB_REPOSITORY" \
            --build-id "$GITHUB_RUN_ID" --build-attempt "$GITHUB_RUN_ATTEMPT" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > release.json
      - name: Identify this build attempt
        id: artifact
        run: echo "name=blog-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: app/release.json
          if-no-files-found: error
          retention-days: 30

      - name: Record image preparation without deployment permission
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_only == true && inputs.maintenance_context == ''
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,os,pathlib
          manifest=json.loads(pathlib.Path('release.json').read_text())
          digest=hashlib.sha256(json.dumps(manifest,sort_keys=True,separators=(',',':'),ensure_ascii=True,allow_nan=False).encode()).hexdigest()
          proof={'schema_version':1,'prepare_only':True,'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'source_sha':os.environ['RELEASE_SHA'],'manifest_sha256':digest}
          pathlib.Path('preparation.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          PYTHON
      - name: Retain authenticated preparation receipt
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_only == true && inputs.maintenance_context == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blog-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/preparation.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain closed maintenance context for final host authorization
        if: inputs.maintenance_context != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blog-maintenance-context
          path: maintenance-context.json
          if-no-files-found: error
          retention-days: 7

  maintenance_metadata:
    name: Refresh official maintenance metadata
    if: inputs.maintenance_context != ''
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: built
      - name: Authenticate source proof and refresh official metadata without executing dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT_JSON: ${{ inputs.maintenance_context }}
          REQUEST_JSON: ${{ inputs.maintenance_request }}
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
          RELEASE_VERSION: ${{ needs.gate.outputs.version }}
        run: |
          umask 077
          python3 - <<'PYTHON'
          import os,pathlib
          for key,name in [('CONTEXT_JSON','maintenance-context.json'),('REQUEST_JSON','maintenance-request.json')]:
            raw=os.environ[key].encode()
            if len(raw)>16384: raise SystemExit('INPUT_TOO_LARGE')
            pathlib.Path(name).write_bytes(raw)
          PYTHON
          python3 scripts/maintenance-execution.py registry-refresh --request maintenance-request.json --manifest built/release.json --output registry.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: blog-maintenance-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: registry.json
          if-no-files-found: error
          retention-days: 7

  rollout:
    if: >-
      always() && needs.gate.result == 'success' && needs.build.result == 'success' &&
      ((inputs.maintenance_context != '' && needs.maintenance_metadata.result == 'success') ||
       (inputs.maintenance_context == '' && (github.event_name != 'workflow_dispatch' || inputs.prepare_only == false)))
    name: Checkpoint, preflight and controlled Blog rollout
    needs: [gate, build, maintenance_metadata]
    permissions:
      contents: read
      packages: read
      actions: read
    uses: leodotsinc/.github/.github/workflows/deploy.yml@75bb057aaa633335b54c38f4729f96879264e070
    with:
      app_id: blog
      release_artifact: ${{ needs.build.outputs.artifact_name }}
      release_file: release.json
      release_sha: ${{ needs.gate.outputs.sha }}
      maintenance_artifact: ${{ inputs.maintenance_context != '' && 'blog-maintenance-context' || '' }}
      maintenance_file: ${{ inputs.maintenance_context != '' && 'maintenance-context.json' || '' }}
      vps_host: ${{ vars.VPS_IP }}
      ssh_port: ${{ vars.SSH_PORT }}
      deploy_user: ${{ vars.DEPLOY_USER }}
    secrets:
      deploy_key: ${{ secrets.BLOG_DEPLOY_KEY }}
      known_hosts: ${{ secrets.BLOG_SSH_KNOWN_HOSTS }}

  publish:
    name: Publish verified Blog release
    needs: [gate, build, rollout]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_SHA: ${{ needs.gate.outputs.sha }}
      APP_VERSION: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.rollout.outputs.result_artifact }}
      - name: Extract and validate verified release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("deployment-result.json").read_text())
          if result.get("ok") is not True or result.get("release", {}).get("deployment", {}).get("status") != "verified":
              raise SystemExit("deployment result is not verified")
          Path("deployed-release.json").write_text(json.dumps(result["release"], indent=2) + "\n")
          PY
      - name: Publish version only after verified deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py deployed-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: blog-deployed-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployed-release.json
          if-no-files-found: ignore
          retention-days: 90

  reconcile:
    name: Reconcile verified deployment record
    needs: [gate, rollout, publish]
    permissions:
      actions: read
      contents: read
    uses: leodotsinc/.github/.github/workflows/reconcile.yml@5242d92c3bb190f207fd202d21b3df5338ad52e4
    with:
      app_id: blog
      result_artifact: ${{ needs.rollout.outputs.result_artifact }}
      result_file: deployment-result.json
      source_sha: ${{ needs.gate.outputs.sha }}
      app_client_id: ${{ vars.CLOUDBOX_INFRA_RECONCILE_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.CLOUDBOX_INFRA_RECONCILE_PRIVATE_KEY }}
